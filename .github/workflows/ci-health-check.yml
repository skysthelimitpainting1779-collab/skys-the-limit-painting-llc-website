name: CI Health

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-health
  cancel-in-progress: true

jobs:
  quality:
    name: Scheduled Quality Gate
    uses: ./.github/workflows/quality-gate.yml
    secrets: inherit

  production-smoke:
    name: Production Route Smoke Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Check live customer routes
        run: npm run smoke:site -- --base-url https://www.skysthelimitpaintingllc.com

  report-failure:
    name: Report Health Failure
    needs: [quality, production-smoke]
    if: always() && (needs.quality.result != 'success' || needs.production-smoke.result != 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create one open health issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'CI health check failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const qualityResult = '${{ needs.quality.result }}';
            const productionResult = '${{ needs.production-smoke.result }}';
            const summary = `Quality gate: ${qualityResult}; production smoke: ${productionResult}.`;
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = openIssues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `The scheduled health checks failed again. ${summary} Review the run: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `The scheduled repository or production health check failed. ${summary} Review the run: ${runUrl}`,
              });
            }

  resolve-health:
    name: Resolve Health Incident
    needs: [quality, production-smoke]
    if: always() && needs.quality.result == 'success' && needs.production-smoke.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close resolved health issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'CI health check failed';
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            for (const issue of openIssues.filter((item) => item.title === title && !item.pull_request)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'The repository quality gate and live production smoke checks are healthy again. Closing this incident.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
