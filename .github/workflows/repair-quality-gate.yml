name: Repair Quality Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    name: Repair test and dependency contracts
    if: github.head_ref == 'infra/normalize-ci-cd'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Repair package and test contracts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text())
          package['scripts']['test'] = 'tsx --test tests/*.mjs'
          package['dependencies']['@libsql/client'] = '0.17.4'
          package['dependencies'].pop('react-router-dom', None)
          package['dependencies'] = dict(sorted(package['dependencies'].items()))
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          def replace(path, old, new):
              file = root / path
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1))

          replace(
              'tests/e2e.test.mjs',
              """  test('T1.4 Routing & Navigation - Redirects for legacy routes redirect to new pages', () => {
    // SSOT is vercel.ts (typed Vercel config); assert redirect routes as source.
    const vercelTs = read('vercel.ts');
    assert.match(vercelTs, /routes\\.redirect\\('\/services',\\s*'\/residential'/);
    assert.match(vercelTs, /routes\\.redirect\\('\/services\/interior',\\s*'\/residential'/);
  });""",
              """  test('T1.4 Routing & Navigation - Redirects for legacy routes redirect to new pages', () => {
    const vercel = JSON.parse(read('vercel.json'));
    assert.ok(vercel.redirects.some(({ source, destination }) => source === '/services' && destination === '/residential'));
    assert.ok(vercel.redirects.some(({ source, destination }) => source === '/services/interior' && destination === '/residential'));
  });""",
          )
          replace(
              'tests/e2e.test.mjs',
              "assert.match(home, /Residential detail\\. Commercial discipline\\. Public-sector ready\\./);",
              "assert.match(home, /Residential detail\\. Commercial discipline\\.[\\s\\S]*Preps[\\s\\S]*first\\./i);",
          )
          replace(
              'tests/e2e.test.mjs',
              """  test('T2.3 Routing & Navigation - CSP and HTTP security headers are configured in vercel.ts', () => {
    const vercelTs = read('vercel.ts');
    assert.match(vercelTs, /Content-Security-Policy/);
    assert.match(vercelTs, /default-src 'self'/);
    assert.match(vercelTs, /object-src 'none'/);
    assert.match(vercelTs, /frame-ancestors 'none'/);
    assert.match(vercelTs, /Strict-Transport-Security/);
  });""",
              """  test('T2.3 Routing & Navigation - CSP and HTTP security headers are configured in vercel.json', () => {
    const vercel = read('vercel.json');
    assert.match(vercel, /Content-Security-Policy/);
    assert.match(vercel, /default-src 'self'/);
    assert.match(vercel, /object-src 'none'/);
    assert.match(vercel, /frame-ancestors 'none'/);
    assert.match(vercel, /Strict-Transport-Security/);
  });""",
          )

          replace(
              'tests/remediation.test.mjs',
              """test('Vercel config has security headers and no blanket SPA rewrite', () => {
  // SSOT is vercel.ts (not vercel.json) — see vercel.ts header comment.
  assert.ok(existsSync(new URL('../vercel.ts', import.meta.url)), 'vercel.ts should exist');
  assert.ok(!existsSync(new URL('../vercel.json', import.meta.url)), 'vercel.json must not coexist with vercel.ts');

  const vercelTs = read('vercel.ts');
  for (const key of [
    'X-Content-Type-Options',
    'X-Frame-Options',
    'Referrer-Policy',
    'Permissions-Policy',
    'Strict-Transport-Security',
    'Content-Security-Policy',
  ]) {
    assert.match(vercelTs, new RegExp(key.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')), `${key} header is missing`);
  }

  // No blanket SPA rewrite (marketing is Next App Router, not Vite SPA).
  assert.doesNotMatch(vercelTs, /rewrites\\s*:/);
  assert.match(vercelTs, /routes\\.redirect\\('\/services'/);
});""",
              """test('Vercel config has security headers and no blanket SPA rewrite', () => {
  assert.ok(!existsSync(new URL('../vercel.ts', import.meta.url)), 'legacy vercel.ts should remain deleted');
  assert.ok(existsSync(new URL('../vercel.json', import.meta.url)), 'vercel.json should exist');

  const vercel = JSON.parse(read('vercel.json'));
  const headerKeys = new Set(vercel.headers.flatMap((rule) => rule.headers ?? []).map(({ key }) => key));
  for (const key of [
    'X-Content-Type-Options',
    'X-Frame-Options',
    'Referrer-Policy',
    'Permissions-Policy',
    'Strict-Transport-Security',
    'Content-Security-Policy',
  ]) {
    assert.ok(headerKeys.has(key), `${key} header is missing`);
  }

  assert.ok(!Object.hasOwn(vercel, 'rewrites'));
  assert.ok(vercel.redirects.some(({ source, destination }) => source === '/services' && destination === '/residential'));
});""",
          )

          replace(
              'tests/site-architecture.test.mjs',
              "assert.match(home, /Residential detail\\. Commercial discipline\\. Public-sector ready\\./);",
              "assert.match(home, /Residential detail\\. Commercial discipline\\.[\\s\\S]*Preps[\\s\\S]*first\\./i);",
          )
          replace(
              'tests/site-architecture.test.mjs',
              """  assert.ok(existsSync(new URL('../vercel.ts', import.meta.url)), 'vercel.ts should exist');
  assert.ok(!existsSync(new URL('../vercel.json', import.meta.url)), 'vercel.json must not coexist with vercel.ts');
  const vercelTs = read('vercel.ts');""",
              """  assert.ok(!existsSync(new URL('../vercel.ts', import.meta.url)), 'legacy vercel.ts should remain deleted');
  assert.ok(existsSync(new URL('../vercel.json', import.meta.url)), 'vercel.json should exist');
  const vercelJson = read('vercel.json');""",
          )
          replace(
              'tests/site-architecture.test.mjs',
              "assert.match(vercelTs, new RegExp(escapeRegExp(key)), `${key} header is missing`);",
              "assert.match(vercelJson, new RegExp(escapeRegExp(key)), `${key} header is missing`);",
          )
          replace(
              'tests/site-architecture.test.mjs',
              "assert.doesNotMatch(vercelTs, /rewrites\\s*:/);",
              "assert.ok(!Object.hasOwn(JSON.parse(vercelJson), 'rewrites'));",
          )
          PY

      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit repairs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Contracts are already repaired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json tests/e2e.test.mjs tests/remediation.test.mjs tests/site-architecture.test.mjs
          git commit -m "fix(ci): align tests and runtime dependencies"
          git push origin HEAD:${{ github.head_ref }}
