name: Repair Quality Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    name: Repair test and dependency contracts
    if: github.head_ref == 'infra/normalize-ci-cd'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Repair package and test contracts
        run: node scripts/repair-ci-contracts.mjs

      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit repairs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Contracts are already repaired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json tests/e2e.test.mjs tests/remediation.test.mjs tests/site-architecture.test.mjs
          git commit -m "fix(ci): align tests and runtime dependencies"
          git push origin HEAD:${{ github.head_ref }}
