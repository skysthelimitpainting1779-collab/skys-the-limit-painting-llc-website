name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/production-release.json'
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Confirm a production deployment from the selected ref
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  quality:
    name: Production Quality Gate
    if: github.event_name == 'push' || inputs.deploy_production == true
    uses: ./.github/workflows/quality-gate.yml
    secrets: inherit

  deploy-production:
    name: Deploy Production
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://www.skysthelimitpaintingllc.com
    env:
      VERCEL_ORG_ID: team_bseTA2AuCO6A2fCOVY9ubrJo
      VERCEL_PROJECT_ID: prj_L3ZMoQ79YLx9G2o6Lg9OubqO9H8m
      VERCEL_SCOPE: skysthelimitpainting1779-4125s-projects
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Verify production credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured"
            exit 1
          fi

      - name: Verify selected production ref is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Production releases must point to a commit on main"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel production environment
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      - name: Build Vercel production artifact
        run: npx vercel build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      - name: Start isolated production deployment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          timeout 5m npx vercel deploy --prebuilt --prod --skip-domain --archive=tgz --no-wait --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" > deployment-url.txt
          deployment_url="$(tail -n 1 deployment-url.txt | tr -d '\r')"
          if [[ ! "$deployment_url" =~ ^https:// ]]; then
            echo "::error::Vercel did not return a deployment URL"
            cat deployment-url.txt
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Production candidate: $deployment_url"

      - name: Wait for production candidate readiness
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in $(seq 1 30); do
            if npx vercel curl / --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" > /dev/null; then
              echo "Production candidate is ready."
              exit 0
            fi
            echo "Candidate is not ready yet (attempt $attempt/30)."
            sleep 10
          done
          echo "::error::Production candidate did not become ready within five minutes"
          exit 1

      - name: Smoke-test deployment before promotion
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for route in / /estimate /contact /projects /robots.txt /sitemap.xml; do
            echo "Checking $route on $DEPLOYMENT_URL"
            npx vercel curl "$route" --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" > /dev/null
          done

      - name: Reclaim and verify production domain
        run: |
          npx vercel domains add www.skysthelimitpaintingllc.com --force --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          npx vercel domains inspect www.skysthelimitpaintingllc.com --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          npx vercel domains verify www.skysthelimitpaintingllc.com --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      - name: Promote verified deployment project-wide
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: npx vercel promote "$DEPLOYMENT_URL" --timeout=0 --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      - name: Verify live customer routes
        run: |
          for attempt in 1 2 3 4 5 6; do
            if npm run smoke:site -- --base-url https://www.skysthelimitpaintingllc.com; then
              exit 0
            fi
            echo "Production routing has not converged yet (attempt $attempt/6)."
            sleep 10
          done
          echo "::error::Production domain failed smoke checks after promotion"
          exit 1

  create-release:
    name: Create GitHub Release
    needs: deploy-production
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
