name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/production-release.json'
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Confirm a production deployment from the selected ref
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  quality:
    name: Production Quality Gate
    if: github.event_name == 'push' || inputs.deploy_production == true
    uses: ./.github/workflows/quality-gate.yml
    secrets: inherit

  deploy-production:
    name: Deploy Production
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://www.skysthelimitpaintingllc.com
    env:
      VERCEL_ORG_ID: team_bseTA2AuCO6A2fCOVY9ubrJo
      VERCEL_PROJECT_ID: prj_L3ZMoQ79YLx9G2o6Lg9OubqO9H8m
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Verify production credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured"
            exit 1
          fi

      - name: Verify selected production ref is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Production releases must point to a commit on main"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel production environment
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy isolated production artifact
        id: deploy
        run: |
          deployment_url="$(npx vercel deploy --prebuilt --prod --skip-domain --archive=tgz --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Production candidate: $deployment_url"

      - name: Smoke-test deployment before promotion
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for route in / /estimate /contact /projects /robots.txt /sitemap.xml; do
            echo "Checking $route on $DEPLOYMENT_URL"
            npx vercel curl "$route" --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /dev/null
          done

      - name: Promote deployment to production domain
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          deployment_url="$DEPLOYMENT_URL"
          npx vercel alias set "$deployment_url" www.skysthelimitpaintingllc.com --token="$VERCEL_TOKEN"

      - name: Verify live customer routes
        run: |
          for attempt in 1 2 3 4 5 6; do
            if npm run smoke:site -- --base-url https://www.skysthelimitpaintingllc.com; then
              exit 0
            fi
            echo "Production routing has not converged yet (attempt $attempt/6)."
            sleep 10
          done
          echo "::error::Production domain failed smoke checks after promotion"
          exit 1

  create-release:
    name: Create GitHub Release
    needs: deploy-production
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
