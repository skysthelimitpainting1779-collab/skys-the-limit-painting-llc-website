name: Learning Guard

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: learning-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  HOOKS_SKIP: '1'
  ENTIRE_SYNC_SKIP: '1'
  GRAPHIFY_SKIP_HOOK: '1'

jobs:
  active-prevention:
    name: Verify Active Prevention
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Run active prevention self-test
        run: npm run learn:prevent:test

      - name: Verify active prevention rebuild
        run: npm run learn:prevent:rebuild
