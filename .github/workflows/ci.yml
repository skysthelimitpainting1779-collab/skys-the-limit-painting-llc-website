name: CI

on:
  push:
    branches:
      - main
      - staging
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
      - 'infra/**'
      - 'devin/**'
      - 'agent/**'
      - 'dependabot/**'
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  git-standards:
    name: Git Standards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Enforce branch and commit standards
        run: node scripts/enforce-git.js
        env:
          GIT_GUARD_STRICT: '1'

  quality:
    name: Quality Gate
    needs: git-standards
    uses: ./.github/workflows/quality-gate.yml
    secrets: inherit
